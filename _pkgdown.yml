url: https://gianluca-sottile.github.io/islasso
template:
  bootstrap: 5
  bootswatch: yeti
  light-switch: true
  math-rendering: katex

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: "Get Started"
      href: articles/islasso-intro.html
    reference:
      text: "Reference"
      href: reference/index.html
    articles:
      text: "Vignettes"
      menu:
        - text: "Introduction to islasso"
          href: articles/islasso-intro.html
        - text: "Methodology and algorithm"
          href: articles/islasso-methodology.html
        - text: "GLMs and families"
          href: articles/islasso-glm.html
        - text: "High-dimensional data"
          href: articles/islasso-highdim.html
    news:
      text: "Changelog"
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/gianluca-sottile/islasso
      aria-label: GitHub repository

authors:
  sidebar:
    - name: Gianluca Sottile
      url: https://gianluca-sottile.github.io

home:
  title: "islasso"
  description: "Induced Smoothed Lasso for high-dimensional regression and hypothesis testing."

news:
  cran_dates: true

